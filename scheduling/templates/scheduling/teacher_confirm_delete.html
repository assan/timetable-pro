{% extends 'base.html' %}
{% block title %}Удаление инструктора{% endblock %}
{% block content %}
<h2>Подтверждение удаления</h2>
<p>Вы уверены, что хотите удалить инструктора <strong>{{ object.name }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Подтвердить удаление</button>
    <button type="button" onclick="window.location.href='{% url 'scheduling:students' %}'">Отмена</button>
</form>
{% endblock %}
